# The project name is explicit on purpose. Compose defaults it to the
# directory name — "backend" — which every project on this machine also uses,
# so without this line `docker compose up` here adopts and recreates another
# project's containers. Ports are shifted off the defaults for the same reason.
name: chaos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chaos
      POSTGRES_PASSWORD: chaos
      POSTGRES_DB: chaos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://chaos:chaos@postgres:5432/chaos?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
