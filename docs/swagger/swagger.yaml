basePath: /api/v1
definitions:
  github_com_chaosapp_backend_internal_common_response.Body:
    properties:
      data: {}
      error:
        type: string
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      success:
        type: boolean
    type: object
  github_com_chaosapp_backend_internal_common_response.ListData:
    properties:
      items: {}
      meta:
        $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Meta'
    type: object
  github_com_chaosapp_backend_internal_common_response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.AuthResponse:
    properties:
      is_new:
        description: first sign-in → show onboarding
        type: boolean
      tokens:
        $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.TokenPair'
      user:
        $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_user_dto.UserResponse'
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.FirebaseLoginRequest:
    properties:
      id_token:
        minLength: 20
        type: string
    required:
    - id_token
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 60
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.ResetPasswordRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.TokenPair:
    properties:
      access_token:
        type: string
      expires_in:
        description: access-token TTL, seconds
        type: integer
      refresh_token:
        type: string
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.UpdateMeRequest:
    properties:
      avatar_url:
        type: string
      name:
        maxLength: 60
        minLength: 2
        type: string
      palette_id:
        enum:
        - tide
        - mint
        - rose
        - sun
        - iris
        type: string
    type: object
  github_com_chaosapp_backend_internal_domain_auth_dto.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  github_com_chaosapp_backend_internal_domain_user_dto.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 60
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        enum:
        - user
        - admin
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_chaosapp_backend_internal_domain_user_dto.UpdateUserRequest:
    properties:
      avatar_url:
        type: string
      name:
        maxLength: 60
        minLength: 2
        type: string
      role:
        enum:
        - user
        - admin
        type: string
    type: object
  github_com_chaosapp_backend_internal_domain_user_dto.UserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      handle:
        type: string
      id:
        type: string
      name:
        type: string
      palette_id:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  internal_domain_device.RegisterRequest:
    properties:
      platform:
        enum:
        - ios
        - android
        type: string
      push_token:
        maxLength: 512
        minLength: 10
        type: string
    required:
    - platform
    - push_token
    type: object
info:
  contact: {}
  description: Group chat with an AI that actually decides things. Clean architecture,
    JWT auth with refresh rotation.
  title: Chaos API
  version: "1.0"
paths:
  /auth/account:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      security:
      - BearerAuth: []
      summary: Permanently delete my account
      tags:
      - auth
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: current + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      security:
      - BearerAuth: []
      summary: Change password (authenticated)
      tags:
      - auth
  /auth/firebase:
    post:
      consumes:
      - application/json
      parameters:
      - description: firebase id token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.FirebaseLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.AuthResponse'
              type: object
      summary: Sign in with Apple or Google (Firebase ID token)
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Request a password-reset email
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.AuthResponse'
              type: object
      summary: Login with email + password
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Revoke a refresh token
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      security:
      - BearerAuth: []
      summary: Current authenticated user
      tags:
      - auth
    patch:
      consumes:
      - application/json
      parameters:
      - description: fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      security:
      - BearerAuth: []
      summary: Update the current user's profile (name, avatar)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.TokenPair'
              type: object
      summary: Rotate the refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.AuthResponse'
              type: object
      summary: Register with email + password
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: token + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Reset password with a one-time token
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_auth_dto.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Verify email with a one-time token
      tags:
      - auth
  /conversations:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Every conversation you are in, newest activity first
      tags:
      - conversations
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Start a conversation
      tags:
      - conversations
  /conversations/{id}/choose:
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Pick one of Chaos's options — says so in the thread
      tags:
      - conversations
  /conversations/{id}/messages:
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Say something to the group — Chaos answers when the turn earns it
      tags:
      - conversations
  /decisions/{id}/vote:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Vote on a decision Chaos put to the group
      tags:
      - conversations
  /directory/search:
    get:
      parameters:
      - description: at least 2 characters
        in: query
        name: q
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Search people to add to a conversation
      tags:
      - directory
  /groups:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Your groups
      tags:
      - groups
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Make a group
      tags:
      - groups
  /groups/{id}/ask:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Ask a question across everything this group has said
      tags:
      - groups
  /groups/{id}/memory:
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Tell the group something to remember
      tags:
      - groups
  /links/preview:
    get:
      parameters:
      - description: The link to preview
        in: query
        name: url
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Read a link's title, description and picture for a card preview
      tags:
      - links
  /me/devices:
    post:
      consumes:
      - application/json
      parameters:
      - description: device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_device.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      security:
      - BearerAuth: []
      summary: Register this device for push notifications
      tags:
      - devices
  /me/devices/{token}:
    delete:
      parameters:
      - description: push token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      security:
      - BearerAuth: []
      summary: Stop push to this device (sign-out)
      tags:
      - devices
  /me/facts:
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Tell Chaos something about you — free text in, facts out
      tags:
      - profile
  /me/facts/learn:
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Bring your context over from another assistant
      tags:
      - profile
  /me/facts/refresh:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Mine what you have said since last time for new facts
      tags:
      - profile
  /me/profile:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: Your profile and everything Chaos knows about you
      tags:
      - profile
  /media:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: the file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      security:
      - BearerAuth: []
      summary: Upload a media file (image/video/audio/pdf, max 25 MB)
      tags:
      - media
  /people/collaborators:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      summary: The people you share the most conversations with
      tags:
      - people
  /users:
    get:
      parameters:
      - description: page
        in: query
        name: page
        type: integer
      - description: limit
        in: query
        name: limit
        type: integer
      - description: search name/email
        in: query
        name: search
        type: string
      - description: name|email|created_at|updated_at
        in: query
        name: sort
        type: string
      - description: asc|desc
        in: query
        name: order
        type: string
      - description: user|admin
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.ListData'
              type: object
      security:
      - BearerAuth: []
      summary: List users with pagination, search, filter, sort (admin)
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_user_dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_user_dto.UserResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create a user (admin)
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: user id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
      security:
      - BearerAuth: []
      summary: Soft-delete a user (admin)
      tags:
      - users
    get:
      parameters:
      - description: user id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_user_dto.UserResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get a user by id
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: user id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_user_dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_chaosapp_backend_internal_common_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_chaosapp_backend_internal_domain_user_dto.UserResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Update a user (admin)
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
